name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Print toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check localization
        run: python3 scripts/check-l10n.py

      - name: Check version metadata
        run: python3 scripts/check-version.py

      - name: Check screenshot conventions
        run: python3 scripts/optimize-screenshots.py --check

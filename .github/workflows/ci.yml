name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check localization
        run: python3 scripts/check-l10n.py

      - name: Check version metadata
        run: python3 scripts/check-version.py

      - name: Check screenshot conventions
        run: python3 scripts/optimize-screenshots.py --check

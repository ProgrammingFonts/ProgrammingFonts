name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [master, main, develop]
    paths-ignore:
      - '**.md'
      - 'screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache SwiftPM
        if: false
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: macos-15-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            macos-15-spm-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Print toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Clean build caches
        run: |
          rm -rf .build
          rm -rf ~/Library/Caches/org.swift.swiftpm

      - name: Resolve package
        run: swift package resolve -v

      - name: Build
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          swift build -v > build.log 2>&1
          status=$?
          echo "build_log_bytes=$(wc -c < build.log | tr -d ' ')"
          if [ "$status" -ne 0 ]; then
            echo "=== swift build failed (exit $status) ==="
            cat build.log
            exit "$status"
          fi
          cat build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-build-log
          path: build.log

      - name: Summarize build log
        if: failure()
        run: |
          echo "## Swift build log" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(build.log missing)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: swift test

      - name: Check localization
        run: python3 scripts/check-l10n.py

      - name: Check version metadata
        run: python3 scripts/check-version.py

      - name: Check screenshot conventions
        run: python3 scripts/optimize-screenshots.py --check

name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      requires_macos: ${{ steps.changes.outputs.requires_macos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes requiring macOS
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          requires_macos=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            requires_macos=true
          else
            while IFS= read -r -d '' file; do
              case "$file" in
                *.md|screenshots/*|.github/ISSUE_TEMPLATE/*) ;;
                *) requires_macos=true; break ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "requires_macos=$requires_macos" >> "$GITHUB_OUTPUT"

  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check localization
        run: python3 scripts/check-l10n.py

      - name: Check version metadata
        run: python3 scripts/check-version.py

      - name: Check screenshot conventions
        run: python3 scripts/optimize-screenshots.py --check

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.requires_macos == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: macos-15-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            macos-15-spm-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Print toolchain
        run: |
          sw_vers
          xcode-select -p
          swift --version

      - name: Resolve package
        run: swift package resolve

      - name: Check Swift style
        run: bash scripts/check-swift-style.sh

      - name: Build
        shell: bash
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: |
          swift build --build-tests > build.log 2>&1
          status=$?
          echo "build_log_bytes=$(wc -c < build.log | tr -d ' ')"
          if [ "$status" -ne 0 ]; then
            echo "=== swift build failed (exit $status) ==="
            cat build.log
            exit "$status"
          fi
          cat build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-build-log
          path: build.log

      - name: Summarize build log
        if: failure()
        run: |
          echo "## Swift build log" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(build.log missing)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        shell: bash
        run: |
          swift test --parallel --enable-code-coverage 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== swift test failed (exit $status) ==="
            tail -80 test.log
            exit "$status"
          fi
          # Resolve the XCTest binary path dynamically (product name casing varies).
          TEST_BIN="$(find -L .build/debug -path '*.xctest/Contents/MacOS/*' -type f -perm -111 ! -name '*.dylib' 2>/dev/null | head -n 1)"
          PROFDATA="$(find -L .build/debug -name 'default.profdata' 2>/dev/null | head -n 1)"
          if [[ -z "$TEST_BIN" || -z "$PROFDATA" ]]; then
            echo "=== coverage export skipped: missing binary or profdata ==="
            echo "TEST_BIN=${TEST_BIN:-missing}"
            echo "PROFDATA=${PROFDATA:-missing}"
            exit 1
          fi
          echo "coverage_binary=$TEST_BIN"
          echo "coverage_profdata=$PROFDATA"
          xcrun llvm-cov export \
            "$TEST_BIN" \
            -instr-profile "$PROFDATA" > coverage.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("coverage.json").read_text())
          summaries = data.get("data", [])
          covered = 0
          total = 0
          excluded = (
              "/Sources/RootFontApp/Views/",
              "/Sources/RootFontApp/Localization/Locales/",
              "/Sources/RootFontApp/Localization/L10nKey.swift",
              "/Sources/RootFontApp/RootFontApp.swift",
          )
          for item in summaries:
              for file in item.get("files", []):
                  filename = file.get("filename", "").replace("\\", "/")
                  if "/Sources/RootFontApp/" not in filename:
                      continue
                  if any(path in filename for path in excluded):
                      continue
                  summary = file.get("summary", {}).get("lines", {})
                  covered += summary.get("covered", 0)
                  total += summary.get("count", 0)
          pct = 100.0 if total == 0 else covered * 100.0 / total
          print(f"Coverage: {pct:.2f}% ({covered}/{total})")
          Path("coverage-summary.txt").write_text(f"{pct:.2f}% ({covered}/{total})\n")
          PY
          python3 scripts/check-coverage.py coverage.json --minimum 70.0
          echo "## Code coverage" >> "$GITHUB_STEP_SUMMARY"
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          if grep -E "testFilterLargeCatalogCompletesWithinBudget|Executed .* tests" test.log > /dev/null; then
            echo "## Performance gate" >> "$GITHUB_STEP_SUMMARY"
            grep "testFilterLargeCatalogCompletesWithinBudget" test.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swift-coverage
          path: |
            coverage.json
            coverage-summary.txt

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: test.log
